# TimeTrack — production compose (single VM, ~50 users). See docs/deployment.md.
#
# The dev infra/docker-compose.yml runs ONLY the datastores. This file adds the three app
# images plus a TLS-terminating Caddy reverse proxy. Only the proxy publishes ports (80/443);
# everything else talks over the internal compose network.
#
# Run from the REPO ROOT (env_file paths below are ../ — relative to this file in infra/):
#   docker compose --env-file .env.prod -f infra/docker-compose.prod.yml up -d
#
# First deploy / upgrade — run migrations (and, first time, seed the admin) BEFORE `up`:
#   docker compose --env-file .env.prod -f infra/docker-compose.prod.yml --profile setup run --rm migrate
#   docker compose --env-file .env.prod -f infra/docker-compose.prod.yml --profile setup run --rm seed
#
# Scale the stateless API:
#   docker compose --env-file .env.prod -f infra/docker-compose.prod.yml up -d --scale api=2

# Own project name → own volume/container namespace (timetrack-prod_*), isolated from the dev
# stack (infra/docker-compose.yml, which defaults to the `infra` project). Without this both
# resolve to `infra` and share pgdata/miniodata — a `down -v` on one wipes the other's data.
name: timetrack-prod

services:
  # ---- Datastores (stateful — volumes + backups; deployment §6) --------------------------
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # PG18 images expect the mount at /var/lib/postgresql (data lands in a versioned
    # subdir); /var/lib/postgresql/data fails on boot. Matches the dev compose.
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # appendonly so a restart doesn't drop in-flight BullMQ jobs. Not part of backups —
    # jobs are idempotent and retried (deployment §6).
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # No published ports: the bucket is never public (deployment §1). The dashboard fetches
    # screenshots via short-lived presigned URLs the API mints over the internal network.
    volumes: ['miniodata:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the screenshots bucket before any app boots. Idempotent — safe on every
  # `up`. Without this the first screenshot upload fails with NoSuchBucket on a fresh volume.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    restart: 'no'

  # ---- App images (built from infra/*.Dockerfile, repo root as context) ------------------
  api:
    image: ${IMAGE_PREFIX:-timetrack}/api:${TAG}
    restart: unless-stopped
    env_file: ['../.env.prod']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      createbuckets: { condition: service_completed_successfully }
    # Liveness only — /health is VERSION_NEUTRAL (no /v1). Do NOT use /health/ready here:
    # that checks PG/Redis/MinIO and would flap the container on a transient dep blip.
    # busybox wget (node:alpine) exits non-zero on any non-2xx.
    # 127.0.0.1, NOT localhost: main.ts binds host '0.0.0.0' (IPv4 only), while `localhost`
    # in Alpine resolves to ::1 as well — busybox wget tried IPv6 first and got connection
    # refused, so a perfectly healthy API sat `unhealthy` and blocked the dashboard.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # NOT optional: the partition-provision job keeps activity_samples/screenshots insertable
  # past the seeded partition months, and screenshot/rollup processing runs here (deployment §4).
  worker:
    image: ${IMAGE_PREFIX:-timetrack}/worker:${TAG}
    restart: unless-stopped
    env_file: ['../.env.prod']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      createbuckets: { condition: service_completed_successfully }

  dashboard:
    image: ${IMAGE_PREFIX:-timetrack}/dashboard:${TAG}
    restart: unless-stopped
    env_file: ['../.env.prod']
    # The dashboard is a BFF: it calls the API server-side. Reach it over the internal
    # network, not by hairpinning through the public proxy. Overrides API_URL from env_file.
    environment:
      API_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      # 127.0.0.1 for the same IPv4-only reason as the api healthcheck above.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/login']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ---- Reverse proxy — the ONLY service that publishes ports -----------------------------
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # The Caddyfile routes presigned screenshot URLs by their bucket path prefix, so the
      # proxy needs the same bucket name the API signs with.
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - './Caddyfile:/etc/caddy/Caddyfile:ro'
      - 'caddydata:/data' # issued certificates — persist across restarts
      - 'caddyconfig:/config'
    depends_on:
      api: { condition: service_healthy }
      dashboard: { condition: service_healthy }

  # ---- Setup one-shots (profile: setup — never started by a plain `up`) ------------------
  # migrate deploy is forward-only and non-interactive-safe (unlike migrate dev).
  #
  # Runs the Prisma CLI directly rather than `pnpm db:deploy`. The api image no longer carries
  # the whole pnpm workspace at /repo — it carries a pruned production tree at /app — so there
  # is no workspace root for `pnpm --filter` to resolve against. The CLI itself still ships,
  # because @timetrack/db depends on it.
  #
  # working_dir is the db package: Prisma resolves prisma.config.ts (which carries the
  # datasource URL under Prisma 7) relative to the CWD, and the schema and migrations sit
  # beside it. The path is stable — @timetrack/db is a plain symlink, no content hash in it.
  migrate:
    image: ${IMAGE_PREFIX:-timetrack}/api:${TAG}
    profiles: ['setup']
    working_dir: /app/node_modules/@timetrack/db
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    env_file: ['../.env.prod']
    depends_on:
      postgres: { condition: service_healthy }

  # First-deploy only: seeds the bootstrap ADMIN (needs SEED_ADMIN_EMAIL + SEED_ADMIN_PASSWORD
  # in .env.prod). Rotate that password on first login.
  seed:
    image: ${IMAGE_PREFIX:-timetrack}/api:${TAG}
    profiles: ['setup']
    working_dir: /app/node_modules/@timetrack/db
    # tsx, like the Prisma CLI, is a production dependency of @timetrack/db precisely because
    # this one-shot needs it — see that package.json.
    command: ['node_modules/.bin/tsx', 'prisma/seed.ts']
    env_file: ['../.env.prod']
    depends_on:
      postgres: { condition: service_healthy }

  # One-off repair for time entries that ran unattended (see the script's own header). Its own
  # `ops` profile, NOT `setup`: `--profile setup run` is part of every deploy, and this must never
  # be swept along by one. DRY RUN unless `--apply` is passed:
  #
  #   docker compose -f docker-compose.prod.yml --profile ops run --rm trim-runaway
  #   docker compose -f docker-compose.prod.yml --profile ops run --rm trim-runaway --apply
  #
  # The script's flags hang off ENTRYPOINT, not `command`. `docker compose run SERVICE <args>`
  # REPLACES `command` rather than appending to it, so with a `command:` the flags became the
  # executable — and the node base image's docker-entrypoint.sh dutifully ran `node --min-hours`.
  # Against an `entrypoint:` the same args append, which is the behaviour this needs.
  trim-runaway:
    image: ${IMAGE_PREFIX:-timetrack}/worker:${TAG}
    profiles: ['ops']
    entrypoint: ['node', 'dist/scripts/trim-runaway-entries.js']
    env_file: ['../.env.prod']
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
