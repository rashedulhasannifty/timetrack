name: CI

# Server + web only. Every job here is `ubuntu-latest`, so nothing in this file compiles
# the macOS client — that gate lives in client.yml, on a macOS runner.
on:
  push: { branches: [main] }
  pull_request:

# A new push to the same branch makes the in-flight run obsolete. Without this, iterating on
# a PR ran several full suites concurrently and paid for all of them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: timetrack
          POSTGRES_PASSWORD: timetrack
          POSTGRES_DB: timetrack_test
        ports: ['5432:5432']
        # -d is not optional: pg_isready defaults the database name to the user, so without
        # it the probe asks for a `timetrack` database that was never created and Postgres
        # logs `FATAL: database "timetrack" does not exist` every 5s for the whole job. The
        # probe still passes (the server answers), so this is pure noise — but it buried the
        # real output when we last read this log.
        options: >-
          --health-cmd="pg_isready -U timetrack -d timetrack_test" --health-interval=5s --health-retries=10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://timetrack:timetrack@localhost:5432/timetrack_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }

      # Turbo's cache is per-machine, so on a fresh runner every task is a `cache miss`
      # and lint/typecheck/test/build all execute in full (~2min of the run). Restoring
      # it makes any package whose inputs didn't change replay instead of re-run — on a
      # PR touching one app, that is most of them.
      #
      # The key carries the SHA so each run writes a fresh entry (a fixed key is
      # write-once and would go stale immediately); restore-keys then falls back to the
      # newest prefix match. Actions cache is branch-scoped with read-through to the base
      # branch, so a new PR restores main's cache. Entries are content-addressed, so a
      # stale restore is never wrong — it just misses.
      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Separate from turbo's cache on purpose: turbo.json excludes `.next/cache` from the
      # build outputs (caching it there would balloon the artifact), so Next reports
      # "No build cache found" on every run and recompiles from cold. This restores it for
      # the case that actually matters — a dashboard change, where the turbo build is a
      # miss and Next has to compile.
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/dashboard/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Phase-1 DoD coverage gate (docs/ROADMAP.md): ≥80% on apps/api + packages/contracts.
      # The api run measures the combined unit + Testcontainers e2e suite (RUN_E2E=1 is
      # set inside the script) and fails the build below threshold — it replaces the
      # standalone e2e step, which it subsumes.
      - run: pnpm --filter @timetrack/api test:coverage
      - run: pnpm --filter @timetrack/contracts test:coverage

  # The apps bind host '0.0.0.0' — IPv4 only — but `localhost` inside an Alpine container
  # also resolves to ::1, and busybox wget tries IPv6 first. A probe aimed at localhost
  # therefore fails against a perfectly healthy process. That shipped once: the API sat
  # `unhealthy` with a FailingStreak of 65 while serving fine, which blocked the dashboard
  # (depends_on: service_healthy) and left the proxy — and so TLS — never started.
  infra-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Container probes must use 127.0.0.1, never localhost
        run: |
          if grep -nE '(wget|curl)[^|]*http://localhost' \
               infra/docker-compose.prod.yml infra/docker-compose.yml .github/workflows/deploy.yml; then
            echo "✖ Use 127.0.0.1 — the apps bind 0.0.0.0 (IPv4 only) and localhost may resolve to ::1 first."
            exit 1
          fi
          echo "✓ no localhost probes"

  # The images are built from the workspace with NO .env present (.dockerignore excludes it),
  # which is a different environment from `pnpm build` in the verify job above — that one has
  # DATABASE_URL in process.env. A Dockerfile can therefore break while verify stays green.
  # That happened once (prisma.config.ts resolving env('DATABASE_URL') at generate time), and
  # it was only caught after merge by the deploy workflow. Build here, on the PR, and push
  # nothing — deploy.yml owns publishing.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # full history so gitleaks scans past commits too
      - name: gitleaks — secret scan (full history)
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --config .gitleaks.toml
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (fail on high/critical CVEs)
        # Scoped to --prod: dev-tooling advisories never ship and are handled by
        # Dependabot; a high/critical CVE in a shipped dependency fails the build.
        run: pnpm audit --prod --audit-level high

  no-ai-attribution:
    # CLAUDE.md §0 — enforced in CI as well as locally, because hooks can be skipped with --no-verify.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Scan commit messages and authors
        run: |
          RANGE="origin/${{ github.base_ref || 'main' }}..HEAD"
          if git log --format='%an <%ae>%n%B' $RANGE | grep -Eiq 'claude|anthropic|co-authored-by:.*(copilot|cursor|gpt|gemini)|generated with'; then
            echo "::error::AI attribution found in commit author or message. See CLAUDE.md §0."
            git log --format='%h %an <%ae> %s' $RANGE
            exit 1
          fi
