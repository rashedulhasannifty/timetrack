name: Deploy

# CI green on main → build & push the three images to GHCR → migrate → roll the stack.
#
# This does NOT do first-deploy work (NSG rules, DNS, Docker install, the deploy user, the
# GitHub secrets, the `seed` one-shot). See docs/deployment.md §5 — the workflow takes over
# only once the host is prepared and the first deploy has been done by hand.

# Triggered by CI *completing* on main, not by the push itself. The old `gate` job here
# re-ran lint/typecheck/test/build on a commit CI was verifying at that very moment — a
# second billed job for work already in flight. Keying off the CI run instead means the
# verification still gates the deploy, but is paid for once.
#
# Waiting for CI from inside a job was the obvious alternative and is worse: a job that
# sleeps is billed for every minute it sleeps, and CI's suite runs ~5 minutes. workflow_run
# starts this workflow only once CI has already concluded, so nothing waits.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at the same host at once — concurrent `migrate` runs would race.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Under workflow_run, `github.sha` is the default branch's head when the event fired, NOT
  # the commit CI actually verified — they differ whenever a second merge lands during a run,
  # which would tag and deploy an unverified commit. head_sha is the verified one. The
  # fallback covers workflow_dispatch, where there is no triggering run.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # ── 1. Build the three images and push to GHCR (the artifacts) ──────────────
  build-and-push:
    # A failed, cancelled or timed-out CI run must not deploy. `deploy` needs this job, so
    # skipping here skips the whole workflow. workflow_dispatch stays a manual override.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # ONE job with three build steps, not a matrix. The three Dockerfiles share a
    # byte-identical build stage (node:24-alpine → COPY . . → pnpm install && pnpm build)
    # which is nearly the whole cost, so the only question is how the other two get to
    # reuse it. Measured on this repo:
    #
    #   matrix, parallel, scope per service   5m02s wall  14m03s billable  (nothing shared)
    #   matrix, max-parallel: 1, one scope    7m01s wall   7m01s billable
    #   one job, three steps                     ↓ both — this
    #
    # A matrix pays per-service job setup (checkout, buildx, GHCR login, then pulling the
    # shared stage back out of the gha cache) before it can reuse anything: the replaying
    # services still took ~1m25s each. In one job that setup happens once and steps 2-3 hit
    # the builder's LOCAL cache, with no export/import round-trip between them.
    steps:
      # GHCR supports nested paths, so the three images live under one repo namespace — but
      # Docker rejects an image reference whose namespace has capitals ("repository name must
      # be lowercase") at PARSE time, before it ever reaches the registry.
      # `github.repository_owner` preserves the account's case and Actions expressions have no
      # lower(), so fold it here. This was invisible while the owner was all-lowercase and
      # broke the moment the repo moved to one that is not.
      - name: Resolve the GHCR namespace (Docker requires it lowercase)
        # `tr`, not bash's ${VAR,,}: that needs bash 4+ and macOS ships 3.2, which would
        # break this the moment it runs on a self-hosted Mac runner.
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/timetrack" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the repo root for all three (see infra/*.Dockerfile).
      #
      # Only this first step writes the gha cache. It builds the shared stage from cold, so
      # its export already contains what every later run needs; having all three export the
      # same layers under `mode=max` would just pay the export three times. `workspace` is
      # the scope images.yml writes too — its header always claimed the two workflows shared
      # a scope, which only became true when deploy stopped using scope=<service>.
      - name: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:latest
            ${{ env.IMAGE_PREFIX }}/api:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,mode=max,scope=workspace

      # No cache-to below: the build stage is already in this builder's local cache from the
      # step above, and each runtime stage is a COPY plus a CMD — cheap enough that exporting
      # it costs more than rebuilding it.
      - name: worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/worker.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/worker:latest
            ${{ env.IMAGE_PREFIX }}/worker:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=workspace

      - name: dashboard
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/dashboard.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/dashboard:latest
            ${{ env.IMAGE_PREFIX }}/dashboard:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=workspace

  # ── 2. Deploy ───────────────────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # GHCR supports nested paths, so the three images live under one repo namespace — but
      # Docker rejects an image reference whose namespace has capitals ("repository name must
      # be lowercase") at PARSE time, before it ever reaches the registry.
      # `github.repository_owner` preserves the account's case and Actions expressions have no
      # lower(), so fold it here. This was invisible while the owner was all-lowercase and
      # broke the moment the repo moved to one that is not.
      - name: Resolve the GHCR namespace (Docker requires it lowercase)
        # `tr`, not bash's ${VAR,,}: that needs bash 4+ and macOS ships 3.2, which would
        # break this the moment it runs on a self-hosted Mac runner.
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/timetrack" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # The compose file resolves `env_file: ['../.env.prod']` relative to itself and mounts
      # './Caddyfile', so both must land in <DEPLOY_PATH>/infra/ with .env.prod one level up.
      # scp-action keeps the source path structure, so target is DEPLOY_PATH itself.
      - name: Copy compose + Caddyfile to the host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: 'infra/docker-compose.prod.yml,infra/Caddyfile,infra/backup.sh,infra/systemd/timetrack-backup.service,infra/systemd/timetrack-backup.timer'
          target: ${{ secrets.DEPLOY_PATH }}

      # Render .env.prod from secrets. Values arrive via `envs:` so they are masked in logs
      # and never appear as literal text in this YAML. Written with umask 077 to a tmp file
      # then mv'd, so a reader never sees a partial or world-readable file.
      #
      # CRITICAL: only REQUIRED vars are written unconditionally. packages/config treats an
      # empty string as SET, not absent — `OIDC_ISSUER=` fails z.url() and the API refuses to
      # boot, and an empty SES var makes the all-or-nothing refinement report four confusing
      # errors. So every optional group is emitted only when its secret is non-empty.
      - name: Render .env.prod from secrets
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          API_URL: ${{ secrets.API_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          PUBLIC_DOMAIN: ${{ secrets.PUBLIC_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
          INVITE_TTL_DAYS: ${{ secrets.INVITE_TTL_DAYS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_REDIRECT_URI: ${{ secrets.OIDC_REDIRECT_URI }}
          OIDC_DEFAULT_TEAM_ID: ${{ secrets.OIDC_DEFAULT_TEAM_ID }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_PREFIX,IMAGE_TAG,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,DATABASE_URL,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,MINIO_ROOT_USER,MINIO_ROOT_PASSWORD,S3_BUCKET,S3_ACCESS_KEY,S3_SECRET_KEY,API_URL,APP_URL,CORS_ORIGINS,PUBLIC_DOMAIN,ACME_EMAIL,DASHBOARD_SESSION_SECRET,INVITE_TTL_DAYS,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,MAIL_FROM,SEED_ADMIN_EMAIL,SEED_ADMIN_PASSWORD,OIDC_ISSUER,OIDC_CLIENT_ID,OIDC_CLIENT_SECRET,OIDC_REDIRECT_URI,OIDC_DEFAULT_TEAM_ID
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            umask 077

            # NODE_ENV is hardcoded, never a secret. The schema DEFAULTS to development, and
            # under development the API returns the raw invite token in the API response
            # (users.service.ts) and the APP_URL production guard never fires.
            cat > .env.prod.tmp <<EOF
            NODE_ENV=production
            LOG_LEVEL=info

            # Pinned to this commit so a rollback is "re-run the older workflow".
            IMAGE_PREFIX=${IMAGE_PREFIX}
            TAG=${IMAGE_TAG}

            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            DATABASE_URL=${DATABASE_URL}

            # Internal service addresses — fixed by the compose network, not secrets.
            REDIS_URL=redis://redis:6379
            S3_ENDPOINT=http://minio:9000
            S3_REGION=us-east-1
            # Browser-facing origin for presigned screenshot URLs — deliberately NOT
            # S3_ENDPOINT. That is the container-network name, which no browser can resolve,
            # and SigV4 signs the host, so the URL must be signed for the origin the browser
            # will actually request. Caddy routes /$S3_BUCKET/* to minio (infra/Caddyfile).
            S3_PUBLIC_ENDPOINT=https://${PUBLIC_DOMAIN}

            JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
            JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}

            MINIO_ROOT_USER=${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
            S3_BUCKET=${S3_BUCKET}
            S3_ACCESS_KEY=${S3_ACCESS_KEY}
            S3_SECRET_KEY=${S3_SECRET_KEY}

            API_PORT=3001
            API_URL=${API_URL}
            APP_URL=${APP_URL}
            CORS_ORIGINS=${CORS_ORIGINS}
            PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
            ACME_EMAIL=${ACME_EMAIL}
            DASHBOARD_SESSION_SECRET=${DASHBOARD_SESSION_SECRET}
            EOF

            # ---- Optional groups: emitted ONLY when set (empty != absent, see above) ----
            if [ -n "${INVITE_TTL_DAYS:-}" ]; then
              echo "INVITE_TTL_DAYS=${INVITE_TTL_DAYS}" >> .env.prod.tmp
            fi

            if [ -n "${SMTP_HOST:-}" ]; then
              cat >> .env.prod.tmp <<EOF
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_USER=${SMTP_USER}
            SMTP_PASS=${SMTP_PASS}
            MAIL_FROM=${MAIL_FROM}
            EOF
            fi

            if [ -n "${SEED_ADMIN_EMAIL:-}" ]; then
              cat >> .env.prod.tmp <<EOF
            SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
            SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
            EOF
            fi

            if [ -n "${OIDC_ISSUER:-}" ]; then
              cat >> .env.prod.tmp <<EOF
            OIDC_ISSUER=${OIDC_ISSUER}
            OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
            OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
            OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
            OIDC_DEFAULT_TEAM_ID=${OIDC_DEFAULT_TEAM_ID}
            EOF
            fi

            mv .env.prod.tmp .env.prod
            chmod 600 .env.prod

      # Migrations are forward-only and must land BEFORE the new code rolls (deployment §4).
      # `seed` is deliberately NOT here — it is first-deploy-only and stays a manual one-shot.
      - name: Migrate, then roll the stack
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_PREFIX
          # The action's default is 10m, and this step spends most of that pulling. The runtime
          # image is one big layer (`COPY --from=build /repo /repo`), so a code change
          # invalidates all of it and the host re-downloads ~5.5GB across the three images
          # every deploy. The #143 and #144 deploys were killed mid-download at exactly 10m.
          #
          # 30m is headroom, not a fix. It does not make the pull small (the Dockerfile's job)
          # and it does not make room for it — #147 pulled fine in 5.7m and then died with
          # "no space left on device", which is what the reap below addresses.
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # scp via tar preserves the mode, but re-assert it: a non-executable backup.sh
            # fails only at 02:30, in a systemd unit nobody is watching.
            chmod +x infra/backup.sh

            COMPOSE="docker compose --env-file .env.prod -f infra/docker-compose.prod.yml"

            # Reap superseded images BEFORE pulling, so the headroom exists at the moment it is
            # needed. Nothing here removed them until now and the host filled up: 183 images,
            # 112.7GB, on a 123GB disk — the deploy for #147 died with "no space left on device"
            # extracting a layer. Each deploy lands ~5.5GB that shares NOTHING with what is
            # already there, because the runtime image is one `COPY --from=build /repo /repo`
            # whose hash changes on every commit.
            #
            # Scoped to our own prefix by reference, NOT a blanket `docker image prune -af`:
            # this host carries other workloads and their unused images are not ours to delete.
            # `docker image rm` refuses anything backing a running container, so the generation
            # currently serving traffic survives untouched and only the ones behind it go —
            # steady state is two generations, the live one and the one being rolled to.
            echo "→ disk before: $(df -h / | awk 'NR==2{print $4}') free"
            before=$(docker image ls -q --filter "reference=${IMAGE_PREFIX}/*" | sort -u | wc -l | tr -d '[:space:]')
            docker image ls --filter "reference=${IMAGE_PREFIX}/*" --format '{{.Repository}}:{{.Tag}}' \
              | xargs -r -n1 docker image rm >/dev/null 2>&1 || true
            after=$(docker image ls -q --filter "reference=${IMAGE_PREFIX}/*" | sort -u | wc -l | tr -d '[:space:]')
            echo "→ reaped $((before - after)) superseded image(s), $after still in use"
            echo "→ disk after:  $(df -h / | awk 'NR==2{print $4}') free"

            # --quiet: without it a slow pull emits a progress line per layer per refresh tick
            # (there is no TTY), which buried the real output under ~10k lines and made the
            # failing deploy hard to read. Errors still surface. The timings around it are what
            # tell you whether a future failure was slow or stuck.
            echo "→ pull start $(date -u +%H:%M:%S)"
            $COMPOSE pull --quiet
            echo "→ pull done  $(date -u +%H:%M:%S)"
            $COMPOSE --profile setup run --rm migrate
            $COMPOSE up -d --remove-orphans
            docker logout ghcr.io

            # Liveness, so a failed roll fails the workflow instead of waiting for someone
            # to notice. Probe the api container directly rather than through the proxy:
            # Caddy 308-redirects http://localhost to HTTPS and curl treats a 3xx as success,
            # which would go green without the API being up at all. 127.0.0.1 rather than
            # localhost: the API binds IPv4-only, and localhost may resolve to ::1 first.
            for i in $(seq 1 30); do
              if $COMPOSE exec -T api wget -qO- http://127.0.0.1:3001/health > /dev/null 2>&1; then
                echo "✓ api /health responding"; exit 0
              fi
              sleep 5
            done
            echo "✖ api /health did not come up within 150s"
            $COMPOSE ps
            $COMPOSE logs --tail=50 api
            exit 1
