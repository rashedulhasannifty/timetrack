name: Deploy

# CI green on main → build a release tarball → copy it to the VPS → write shared/.env →
# remote-deploy.sh (datastores up, migrate, atomic symlink flip, PM2 reload, smoke test, rollback).
#
# Topology (docs/deployment.md): api, worker and dashboard run under PM2 as the `deploy` user,
# next to the other apps on the same box; Postgres, Redis and MinIO run in Docker under a
# root-owned systemd unit; the host's Caddy is the only public entrypoint. There are no
# container images for the apps any more, so nothing here touches a registry.
#
# First-deploy work that this does NOT do (docs/vm-setup.md): installing Docker, the datastores
# unit, sudoers rule and status script under /opt/timetrack, the Caddy site block, and the
# one-time admin seed.

# Triggered by CI *completing* on main, not by the push itself, so the suite gates the deploy but
# is paid for once. workflow_dispatch is the manual path: re-deploy, roll back to an older SHA by
# dispatching at that ref, or rehearse a branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at the host at once — concurrent migrations would race. Shared with
# ops-trim-runaway.yml, which rewrites the same tables.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Under workflow_run, `github.sha` is the default branch's head when the event fired, NOT the
  # commit CI verified — they differ whenever a second merge lands during a run. head_sha is the
  # verified one. The fallback covers workflow_dispatch.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    # A failed, cancelled or timed-out CI run must not deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/action-setup@v6
      # Node 24 to match the VPS runtime: argon2 and sharp load native binaries keyed to the
      # Node ABI and to glibc, and this runner (Ubuntu, glibc, x64) matches the host. A bundle
      # built on another major crashes at require time.
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Build
        run: pnpm build
        env:
          # prisma generate (in @timetrack/db's build) loads prisma.config.ts, which resolves
          # env('DATABASE_URL'). It never connects; the var only has to resolve.
          DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public

      - name: Assemble release
        run: |
          set -euo pipefail
          rm -rf release && mkdir -p release

          # `--legacy`: pnpm 10's default deploy requires inject-workspace-packages, which this
          # repo does not set. --prod drops devDependencies; the Prisma CLI and tsx still ship
          # because @timetrack/db depends on them, for on-box migrations and the admin seed.
          pnpm --filter @timetrack/api deploy --prod --legacy release/api
          pnpm --filter @timetrack/worker deploy --prod --legacy release/worker

          # Next standalone traces from the repo root, so server.js is at apps/dashboard/.
          # `cp -a`, never `cp -r`: the standalone tree is held together by pnpm symlinks, and
          # dereferencing them breaks module resolution at boot. .next/static is not part of
          # the standalone output and must be carried over (there is no public/ dir).
          cp -a apps/dashboard/.next/standalone release/dashboard
          mkdir -p release/dashboard/apps/dashboard/.next
          cp -a apps/dashboard/.next/static release/dashboard/apps/dashboard/.next/static

          mkdir -p release/pm2
          cp infra/pm2/ecosystem.config.cjs infra/pm2/env-file.cjs infra/pm2/with-env.cjs release/pm2/
          echo "$DEPLOY_SHA" > release/VERSION

          # Check the shape here, before it ever reaches the VPS. remote-deploy.sh re-checks.
          test -f release/api/dist/main.js
          test -f release/worker/dist/main.js
          test -f release/worker/dist/scripts/trim-runaway-entries.js
          test -f release/dashboard/apps/dashboard/server.js
          test -d release/dashboard/apps/dashboard/.next/static
          test -f release/api/node_modules/@timetrack/db/prisma/schema.prisma
          test -d release/api/node_modules/@timetrack/db/prisma/migrations
          test -e release/api/node_modules/@timetrack/db/node_modules/.bin/prisma
          test -e release/api/node_modules/@timetrack/db/node_modules/.bin/tsx

          # tar, preserving symlinks: the pnpm-deployed node_modules is full of them.
          tar -czpf release.tar.gz -C release .
          ls -lh release.tar.gz

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      # Rendered here and piped over stdin — never argv, which any user on the box can read via
      # `ps`. The host writes it with umask 077 to a temp file, then renames, so nothing ever
      # reads a partial or world-readable file.
      #
      # CRITICAL: EVERY key is written on every run, blank when unused. PM2's reload overrides
      # the variables it is handed but never deletes one that stopped being written, so omitting
      # a key leaves its previous value live in the process — how the MinIO→S3 cutover kept a
      # stale S3_PUBLIC_ENDPOINT and broke every screenshot (2026-09-21, deployment §3).
      # packages/config parses a blank value as absent, which is what makes writing blanks safe.
      - name: Write shared/.env on the VPS
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          API_URL: ${{ secrets.API_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          PUBLIC_DOMAIN: ${{ secrets.PUBLIC_DOMAIN }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
          INVITE_TTL_DAYS: ${{ secrets.INVITE_TTL_DAYS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_REDIRECT_URI: ${{ secrets.OIDC_REDIRECT_URI }}
          OIDC_DEFAULT_TEAM_ID: ${{ secrets.OIDC_DEFAULT_TEAM_ID }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          set -euo pipefail

          # The DATABASE_URL secret names the host the old container network used (`postgres`).
          # The apps now run on the host and reach Postgres over loopback, so re-point the host
          # and keep everything else — credentials, database, query — exactly as given.
          LOCAL_DATABASE_URL="$(node -e '
            const u = new URL(process.env.DATABASE_URL);
            u.hostname = "127.0.0.1"; u.port = "5432";
            process.stdout.write(u.toString());
          ')"

          # Checked BEFORE the group below, not inside it: that group is piped straight into the
          # file the host renames into place, so aborting mid-stream would install a truncated
          # .env. SigV4 signs the region, so a wrong one fails every upload rather than warning.
          if [ -n "${S3_ENDPOINT:-}" ] && [ -z "${S3_REGION:-}" ]; then
            echo "✖ S3_REGION must be set alongside S3_ENDPOINT (the bucket's region)" >&2
            exit 1
          fi

          {
            # NODE_ENV is never a secret. The schema DEFAULTS to development, and under
            # development the API returns the raw invite token and the APP_URL guard never fires.
            echo "NODE_ENV=production"
            echo "LOG_LEVEL=info"

            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_DB=$POSTGRES_DB"
            echo "DATABASE_URL=$LOCAL_DATABASE_URL"

            # Datastore addresses: fixed by infra/datastores (loopback-published), not secrets.
            echo "REDIS_URL=redis://127.0.0.1:6379"

            # Screenshot storage. With S3_ENDPOINT set, screenshots live in an external S3 bucket
            # (deployment §5) and S3_BUCKET/S3_ACCESS_KEY/S3_SECRET_KEY must hold that bucket's
            # values, not MinIO's. Otherwise: the bundled MinIO on loopback.
            if [ -n "${S3_ENDPOINT:-}" ]; then
              echo "S3_ENDPOINT=$S3_ENDPOINT"
              echo "S3_REGION=$S3_REGION"
              # No S3_PUBLIC_ENDPOINT: the presigned URL is already signed for the bucket's own
              # host, which the browser can reach directly. Overriding it would break the
              # signature. The schema has it optional for exactly this case.
            else
              echo "S3_ENDPOINT=http://127.0.0.1:9000"
              echo "S3_REGION=us-east-1"
              # Browser-facing origin for presigned screenshot URLs — deliberately NOT S3_ENDPOINT.
              # SigV4 signs the host, so the URL must be signed for the origin the browser will
              # request; Caddy routes /$S3_BUCKET/* to MinIO with the Host untouched.
              echo "S3_PUBLIC_ENDPOINT=https://$PUBLIC_DOMAIN"
            fi

            echo "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET"
            echo "JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET"

            echo "MINIO_ROOT_USER=$MINIO_ROOT_USER"
            echo "MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD"
            echo "S3_BUCKET=$S3_BUCKET"
            echo "S3_ACCESS_KEY=$S3_ACCESS_KEY"
            echo "S3_SECRET_KEY=$S3_SECRET_KEY"

            echo "API_PORT=3001"
            echo "API_URL=$API_URL"
            echo "APP_URL=$APP_URL"
            echo "CORS_ORIGINS=$CORS_ORIGINS"
            echo "PUBLIC_DOMAIN=$PUBLIC_DOMAIN"
            echo "DASHBOARD_SESSION_SECRET=$DASHBOARD_SESSION_SECRET"

            # ---- Optional keys: ALWAYS emitted, blank when unused ----
            # Never `if [ -n ... ]`. PM2's reload overrides the variables it is handed but never
            # DELETES one that disappeared from this file, so a key that stops being written
            # keeps its previous value in the live process. Omitting S3_PUBLIC_ENDPOINT on the
            # MinIO→S3 cutover is what broke every screenshot on 2026-09-21: uploads went to S3
            # while presigned URLs were still signed for the MinIO public origin.
            #
            # packages/config treats a blank value as absent, which is what makes this safe.
            echo "INVITE_TTL_DAYS=${INVITE_TTL_DAYS:-}"

            echo "SMTP_HOST=${SMTP_HOST:-}"
            echo "SMTP_PORT=${SMTP_PORT:-}"
            echo "SMTP_USER=${SMTP_USER:-}"
            echo "SMTP_PASS=${SMTP_PASS:-}"
            # Written raw: env-file.cjs takes everything after the first `=` literally, so the
            # spaces and angle brackets in `TimeTrack <noreply@…>` need no quoting.
            echo "MAIL_FROM=${MAIL_FROM:-}"

            # SEED_ADMIN_* are deliberately NOT written: the seed is a one-time manual step
            # (docs/vm-setup.md), and a standing admin password has no business in the runtime env.

            echo "OIDC_ISSUER=${OIDC_ISSUER:-}"
            echo "OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}"
            echo "OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}"
            echo "OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}"
            echo "OIDC_DEFAULT_TEAM_ID=${OIDC_DEFAULT_TEAM_ID:-}"

            # Off-site Postgres dumps (infra/backup.sh, deployment §6). Read by the backup script,
            # not the apps. BACKUP_S3_ENDPOINT only for a non-AWS store.
            echo "BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}"
            echo "BACKUP_S3_REGION=${BACKUP_S3_REGION:-}"
            echo "BACKUP_S3_ACCESS_KEY=${BACKUP_S3_ACCESS_KEY:-}"
            echo "BACKUP_S3_SECRET_KEY=${BACKUP_S3_SECRET_KEY:-}"
            echo "BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}"
          } | ssh deploy-target "
            set -euo pipefail
            umask 077
            mkdir -p '$DEPLOY_PATH/shared' '$DEPLOY_PATH/releases' '$DEPLOY_PATH/tmp'
            cat > '$DEPLOY_PATH/shared/.env.tmp'
            mv '$DEPLOY_PATH/shared/.env.tmp' '$DEPLOY_PATH/shared/.env'
            chmod 600 '$DEPLOY_PATH/shared/.env'
          "

      - name: Upload release
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          scp release.tar.gz "deploy-target:$DEPLOY_PATH/tmp/$DEPLOY_SHA.tar.gz"
          scp infra/deploy/remote-deploy.sh "deploy-target:$DEPLOY_PATH/tmp/remote-deploy.sh"

      # The script owns datastores, migrations, the atomic swap, PM2 reload, smoke test and
      # rollback. A non-zero exit means the previous release is still serving (or, on a first
      # deploy, that the box needs a look).
      - name: Deploy, verify, roll back on failure
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh deploy-target "
            set -euo pipefail
            chmod +x '$DEPLOY_PATH/tmp/remote-deploy.sh'
            APP_ROOT='$DEPLOY_PATH' '$DEPLOY_PATH/tmp/remote-deploy.sh' '$DEPLOY_SHA'
          "

      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Deployed \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deploy failed — the previous release should still be serving" >> "$GITHUB_STEP_SUMMARY"
            echo "On the VPS as deploy: \`pm2 logs timetrack-api\`, \`sudo timetrack-status\`." >> "$GITHUB_STEP_SUMMARY"
          fi
