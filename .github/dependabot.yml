version: 2
updates:
  # JS/TS dependencies (Dependabot reads pnpm-lock.yaml via the npm ecosystem).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Each open PR costs a full CI run. Ten at once consumed roughly 170 Actions minutes in
    # a single afternoon, which is why this is 5 rather than 10.
    open-pull-requests-limit: 5
    groups:
      # Batch minor/patch bumps into ONE PR per category. Previously only dev-tooling was
      # grouped and every production dependency opened its own PR — and because a lockfile
      # change on main re-triggers Dependabot for everything it tracks, a single merge
      # fanned out into ten runs.
      #
      # Minor/patch only, in both groups: a grouped major would land several breaking
      # upgrades in one PR. Majors stay UNGROUPED and open one each (CLAUDE.md §2), so a
      # NestJS or TypeScript jump is still reviewed on its own merits.
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  # Keep GitHub Actions pinned versions current (also a supply-chain surface).
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      # Action bumps are almost always safe and land together; one PR, not five.
      github-actions:
        update-types:
          - 'minor'
          - 'patch'
